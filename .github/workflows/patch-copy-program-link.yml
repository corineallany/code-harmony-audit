name: Patch copy program link

on:
  push:
    branches: [main]
    paths:
      - 'src/components/programs/CopyProgramLinkButton.tsx'
      - '.github/workflows/patch-copy-program-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated/programme.$id.tsx')
          s=p.read_text()
          imp='import { ProgramFullExport } from "@/components/programs/ProgramFullExport";'
          newimp=imp+'\nimport { CopyProgramLinkButton } from "@/components/programs/CopyProgramLinkButton";'
          if 'CopyProgramLinkButton' not in s:
              s=s.replace(imp,newimp)
          old='<Button size="sm" variant="outline" onClick={()=>navigator.clipboard.writeText(`${window.location.origin}/programme/${id}`)}>🔗 Copier le lien</Button>'
          s=s.replace(old,'<CopyProgramLinkButton programId={id}/>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/_authenticated/programme.$id.tsx'
          git diff --cached --quiet || git commit -m 'fix: rendre copie lien programme fiable'
          git push
