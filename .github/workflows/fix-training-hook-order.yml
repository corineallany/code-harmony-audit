name: Fix training hook order
on:
  push:
    paths:
      - '.github/workflows/fix-training-hook-order.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix React hook order in Formations
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/_authenticated/formations.tsx')
          s=p.read_text()
          old=''' const mine=(memberPaths.data??[]).filter(x=>x.member_id===member?.id),active=(memberPaths.data??[]).filter(x=>x.status!=="completed"),integrationCount=active.filter(x=>pathById.get(x.path_id)?.path_kind==="integration").length,internalCount=active.filter(x=>pathById.get(x.path_id)?.path_kind==="internal").length,pending=(memberSteps.data??[]).filter(x=>x.status!=="done"&&!x.excluded&&x.required_snapshot).length;\n if(paths.isLoading||steps.isLoading||memberPaths.isLoading||memberSteps.isLoading||sessions.isLoading)return <AppShell title="Formations"><p className="text-sm text-muted-foreground">Chargement…</p></AppShell>;\n const[tab,setTab]=useState("mine");\n'''
          new=''' const[tab,setTab]=useState("mine");\n const mine=(memberPaths.data??[]).filter(x=>x.member_id===member?.id),active=(memberPaths.data??[]).filter(x=>x.status!=="completed"),integrationCount=active.filter(x=>pathById.get(x.path_id)?.path_kind==="integration").length,internalCount=active.filter(x=>pathById.get(x.path_id)?.path_kind==="internal").length,pending=(memberSteps.data??[]).filter(x=>x.status!=="done"&&!x.excluded&&x.required_snapshot).length;\n if(paths.isLoading||steps.isLoading||memberPaths.isLoading||memberSteps.isLoading||sessions.isLoading)return <AppShell title="Formations"><p className="text-sm text-muted-foreground">Chargement…</p></AppShell>;\n'''
          if old not in s:
            raise SystemExit('Expected hook-order block not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/formations.tsx
          git commit -m "fix: stabiliser chargement du module Formation"
          git push
