name: Patch program full export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-program-full-export.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch program sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/_authenticated/programme.$id.tsx')
          s = p.read_text()
          import_anchor = 'import { AppShell, EmptyState } from "@/components/AppShell";'
          import_line = 'import { ProgramFullExport } from "@/components/programs/ProgramFullExport";'
          if import_line not in s:
              s = s.replace(import_anchor, import_anchor + '\n' + import_line)
          old = '<Button size="sm" variant="outline" onClick={()=>window.print()}>🖨️ Feuille de service</Button>'
          new = '<ProgramFullExport program={program} tasks={programTasks} documents={documents.data??[]} notes={notes.data??[]} responses={responses.data??[]} memberName={memberName} poleName={poleName}/>'
          if old not in s and new not in s:
              raise SystemExit('Bouton Feuille de service introuvable')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/routes/_authenticated/programme.$id.tsx'
          git commit -m 'feat: exporter toute la fiche programme par sections'
          git push origin main
