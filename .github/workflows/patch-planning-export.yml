name: Patch planning export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-planning-export.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Patch planning
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/_authenticated/planning.tsx')
          s=p.read_text()
          s=s.replace('import { downloadCsv, exportStamp, toCsv } from "@/lib/exports";','import { downloadExcel, exportStamp, toExcelWorkbook } from "@/lib/exports";\nimport { printPlanningCalendar } from "@/lib/planning-print";')
          old='''  function exportPlanning() {
              const rows = entries.filter((e) => e.date); downloadCsv(`icc-planning-${exportStamp()}.csv`, toCsv(rows, [
                { key: "date", label: "Date", value: (e) => e.date }, { key: "heure", label: "Horaire", value: (e) => [e.startTime, e.endTime].filter(Boolean).join(" - ") },
                { key: "titre", label: "Programme", value: (e) => e.title }, { key: "statut", label: "Statut", value: (e) => STATUS_LABEL[e.status] ?? e.status },
                { key: "affectes", label: "Affectés confirmés", value: (e) => e.assignedCount }, { key: "attente", label: "Réponses en attente", value: (e) => e.pendingResponses },
                { key: "indispo", label: "Alertes indisponibilité", value: (e) => e.unavailableCount }, { key: "renforts", label: "Sollicitations en cours", value: (e) => e.solicitationCount },
                { key: "poles", label: "Pôle(s)", value: (e) => e.poleIds.map((id) => poleName.get(id) ?? id).join(" · ") },
              ]));
            }'''
          # tolerate original two-space indentation exactly as repository
          start=s.index('  function exportPlanning() {')
          end=s.index('  if (programs.isLoading)',start)
          new='''  function exportPlanning() {
            const rows = entries.filter((e) => e.date); const columns = [
              { key: "date", label: "Date", value: (e: Entry) => e.date }, { key: "heure", label: "Horaire", value: (e: Entry) => [e.startTime, e.endTime].filter(Boolean).join(" - ") },
              { key: "titre", label: "Programme", value: (e: Entry) => e.title }, { key: "statut", label: "Statut", value: (e: Entry) => STATUS_LABEL[e.status] ?? e.status },
              { key: "affectes", label: "Affectés", value: (e: Entry) => e.assignedCount }, { key: "attente", label: "Réponses en attente", value: (e: Entry) => e.pendingResponses },
              { key: "indispo", label: "Alertes indisponibilité", value: (e: Entry) => e.unavailableCount }, { key: "renforts", label: "Sollicitations en cours", value: (e: Entry) => e.solicitationCount },
              { key: "poles", label: "Pôle(s)", value: (e: Entry) => e.poleIds.map((id) => poleName.get(id) ?? id).join(" · ") },
            ]; downloadExcel(`icc-planning-${exportStamp()}.xls`, toExcelWorkbook(`COM ICC Le Mans — Planning ${title}`, rows, columns));
          }
          function printPlanning(){ printPlanningCalendar(title, visibleDates, entries, view === "month" ? anchor.getMonth() : null); }
'''
          s=s[:start]+new+s[end:]
          s=s.replace('onClick={() => window.print()}>Imprimer / PDF</Button><Button size="sm" variant="outline" onClick={exportPlanning}>Excel / CSV</Button>','onClick={printPlanning}>Imprimer / PDF · 1 page</Button><Button size="sm" variant="outline" onClick={exportPlanning}>Excel</Button>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/_authenticated/planning.tsx
          git commit -m "feat: planning PDF une page et export Excel propre" || exit 0
          git push
