name: Patch evaluation attendance context
on:
  push:
    paths:
      - '.github/workflows/patch-evaluation-attendance-context.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch evaluation facts and UI
        shell: python
        run: |
          from pathlib import Path

          p=Path('src/lib/evaluation-context.ts')
          s=p.read_text()
          old='''  engagement: {\n    reinforcements: number;\n    replacements: number;\n  };'''
          new='''  attendanceDetails: Array<{\n    programId: string;\n    programTitle: string;\n    date: string | null;\n    presence: string;\n    arrivalTime: string | null;\n    departureTime: string | null;\n    justified: boolean | null;\n    reason: string | null;\n  }>;\n  engagement: {\n    reinforcements: number;\n    replacements: number;\n  };'''
          if old not in s: raise SystemExit('EvaluationFacts insertion point not found')
          s=s.replace(old,new,1)

          old='''  const attendance = (attendanceRes.data ?? []).filter((a: any) => a.member_id === memberId && periodProgramIds.has(a.program_id));\n  const attended = attendance.filter((a: any) => ["present", "retard", "partiel", "renfort"].includes(a.presence));'''
          new='''  const attendance = (attendanceRes.data ?? []).filter((a: any) => a.member_id === memberId && periodProgramIds.has(a.program_id));\n  const programById = new Map(programs.map((p: any) => [p.id, p]));\n  const attendanceDetails = attendance\n    .filter((a: any) => ["retard", "absent", "partiel"].includes(a.presence))\n    .map((a: any) => {\n      const program:any = programById.get(a.program_id);\n      return {\n        programId: a.program_id,\n        programTitle: program?.title ?? "Programme",\n        date: program?.start_date ?? null,\n        presence: a.presence,\n        arrivalTime: a.arrival_time ?? null,\n        departureTime: a.departure_time ?? null,\n        justified: a.justified ?? null,\n        reason: a.justification_reason ?? a.note ?? null,\n      };\n    })\n    .sort((a: any,b: any)=>(b.date??"").localeCompare(a.date??""));\n  const attended = attendance.filter((a: any) => ["present", "retard", "partiel", "renfort"].includes(a.presence));'''
          if old not in s: raise SystemExit('attendance details insertion point not found')
          s=s.replace(old,new,1)

          old='''    engagement: { reinforcements, replacements },'''
          new='''    attendanceDetails,\n    engagement: { reinforcements, replacements },'''
          if old not in s: raise SystemExit('return insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/routes/_authenticated/evaluations.tsx')
          s=p.read_text()
          old='''function FactsPanel({facts,kind}:{facts:EvaluationFacts;kind:EvaluationKind}){const f=facts,internal=f.training.filter(t=>t.kind==="internal"&&t.status!=="completed");return <div className="space-y-3 rounded-xl border border-violet-200 bg-violet-50/40 p-3"><div><p className="text-xs font-black uppercase tracking-wide text-icc-violet">Repères de la période</p><p className="mt-1 text-xs text-muted-foreground">Informations factuelles uniquement : elles ne calculent et ne modifient aucune note.</p></div><div className="grid gap-2 sm:grid-cols-2"><Fact label="Activité" value={`${f.activity.assigned} programmes affectés · ${f.activity.attended} présences · ${f.activity.late} retard(s) · ${f.activity.absent} absence(s)`}/><Fact label="Engagement" value={`${f.engagement.reinforcements} renfort(s) · ${f.engagement.replacements} remplacement(s) effectué(s)`}/><Fact label="Fiabilité" value={`${f.reliability.presenceRate??"—"}% de présence · réponses : ${f.reliability.responsesAnswered}/${f.reliability.responsesTotal}`}/><Fact label="Post-service" value={`${f.postService.incidentsExplicitlyLinked} incident(s) explicitement associé(s) · ${f.postService.positiveProgramNotes} débrief(s) positif(s) · ${f.postService.improvementProgramNotes} axe(s) d’amélioration`}/></div><div className="grid gap-2 sm:grid-cols-2"><Fact label="Fonction actuelle" value={`${f.currentFunction.poles.length?f.currentFunction.poles.join(" · "):"Aucun pôle"}${f.currentFunction.referentPoles.length?` · Référent : ${f.currentFunction.referentPoles.join(", ")}`:""}`}/><Fact label="Compétence(s) en acquisition" value={internal.length?internal.map(t=>`${t.poleName} — ${t.name} ${t.progress}%`).join(" · "):"Aucune formation interne en cours"}/></div>{f.training.length?<div className="space-y-1 rounded-lg bg-background/70 p-2 text-xs"><b>Formation</b>{f.training.map(t=><p key={`${t.pathId}-${t.startedAt}`}>{t.poleName} — {t.name} : {t.progress}% {t.status==="completed"?"· validée":"· en cours"}</p>)}</div>:null}{kind==="referent"&&f.referent?<div className="rounded-lg bg-background/70 p-2 text-xs"><b>Repères Référent</b><p className="mt-1">{f.referent.programsInPoles} programme(s) · couverture : {f.referent.coverageRate??"—"}% · {f.referent.replacementsManaged} remplacement(s) · {f.referent.peopleInTraining} personne(s) en formation · {f.referent.skillsValidated} compétence(s) validée(s)</p></div>:null}</div>}'''
          new='''function FactsPanel({facts,kind}:{facts:EvaluationFacts;kind:EvaluationKind}){const f=facts,internal=f.training.filter(t=>t.kind==="internal"&&t.status!=="completed");const exceptional=f.attendanceDetails??[];const count=(presence:string,justified?:boolean|null)=>exceptional.filter(x=>x.presence===presence&&(justified===undefined||x.justified===justified)).length;const labelStatus=(presence:string)=>presence==="retard"?"Retard":presence==="absent"?"Absence":"Présence partielle";const justification=(v:boolean|null)=>v===true?"Justifié":v===false?"Non justifié":"Justification non renseignée";return <div className="space-y-3 rounded-xl border border-violet-200 bg-violet-50/40 p-3"><div><p className="text-xs font-black uppercase tracking-wide text-icc-violet">Repères de la période</p><p className="mt-1 text-xs text-muted-foreground">Informations factuelles uniquement : elles ne calculent et ne modifient aucune note. La justification est affichée séparément pour permettre une appréciation en contexte.</p></div><div className="grid gap-2 sm:grid-cols-2"><Fact label="Activité" value={`${f.activity.assigned} programmes affectés · ${f.activity.attended} présences · ${f.activity.late} retard(s) · ${f.activity.absent} absence(s)`}/><Fact label="Engagement" value={`${f.engagement.reinforcements} renfort(s) · ${f.engagement.replacements} remplacement(s) effectué(s)`}/><Fact label="Fiabilité" value={`${f.reliability.presenceRate??"—"}% de présence · réponses : ${f.reliability.responsesAnswered}/${f.reliability.responsesTotal}`}/><Fact label="Post-service" value={`${f.postService.incidentsExplicitlyLinked} incident(s) explicitement associé(s) · ${f.postService.positiveProgramNotes} débrief(s) positif(s) · ${f.postService.improvementProgramNotes} axe(s) d’amélioration`}/></div><div className="grid gap-2 sm:grid-cols-3"><Fact label="Retards" value={`${count("retard")} total · ${count("retard",true)} justifié(s) · ${count("retard",false)} non justifié(s)`}/><Fact label="Absences" value={`${count("absent")} total · ${count("absent",true)} justifiée(s) · ${count("absent",false)} non justifiée(s)`}/><Fact label="Présences partielles" value={`${count("partiel")} total · ${count("partiel",true)} justifiée(s) · ${count("partiel",false)} non justifiée(s)`}/></div>{exceptional.length?<details className="rounded-lg border bg-background/80 p-3 text-xs"><summary className="cursor-pointer font-bold text-icc-violet">Voir le détail des retards, absences et présences partielles ({exceptional.length})</summary><div className="mt-3 space-y-2">{exceptional.map((x,i)=><div key={`${x.programId}-${x.presence}-${i}`} className="rounded-lg bg-muted/40 p-2"><div className="flex flex-wrap items-center gap-2"><b>{labelStatus(x.presence)}</b><Badge variant={x.justified===false?"destructive":"outline"}>{justification(x.justified)}</Badge><span className="text-muted-foreground">{x.date?new Date(`${x.date}T12:00:00`).toLocaleDateString("fr-FR"):"Date non renseignée"}</span></div><p className="mt-1 font-medium">{x.programTitle}</p>{x.arrivalTime||x.departureTime?<p className="text-muted-foreground">{x.arrivalTime?`Arrivée : ${x.arrivalTime}`:""}{x.arrivalTime&&x.departureTime?" · ":""}{x.departureTime?`Départ : ${x.departureTime}`:""}</p>:null}{x.reason?<p className="mt-1"><b>Motif :</b> {x.reason}</p>:null}</div>)}</div></details>:null}<div className="grid gap-2 sm:grid-cols-2"><Fact label="Fonction actuelle" value={`${f.currentFunction.poles.length?f.currentFunction.poles.join(" · "):"Aucun pôle"}${f.currentFunction.referentPoles.length?` · Référent : ${f.currentFunction.referentPoles.join(", ")}`:""}`}/><Fact label="Compétence(s) en acquisition" value={internal.length?internal.map(t=>`${t.poleName} — ${t.name} ${t.progress}%`).join(" · "):"Aucune formation interne en cours"}/></div>{f.training.length?<div className="space-y-1 rounded-lg bg-background/70 p-2 text-xs"><b>Formation</b>{f.training.map(t=><p key={`${t.pathId}-${t.startedAt}`}>{t.poleName} — {t.name} : {t.progress}% {t.status==="completed"?"· validée":"· en cours"}</p>)}</div>:null}{kind==="referent"&&f.referent?<div className="rounded-lg bg-background/70 p-2 text-xs"><b>Repères Référent</b><p className="mt-1">{f.referent.programsInPoles} programme(s) · couverture : {f.referent.coverageRate??"—"}% · {f.referent.replacementsManaged} remplacement(s) · {f.referent.peopleInTraining} personne(s) en formation · {f.referent.skillsValidated} compétence(s) validée(s)</p></div>:null}</div>}'''
          if old not in s: raise SystemExit('FactsPanel block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/evaluation-context.ts src/routes/_authenticated/evaluations.tsx
          git commit -m "feat: contextualiser retards et absences dans évaluations" || exit 0
          git push
