name: Deploy ICC Le Mans to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: fticxzuzjgeypvqrfrwk
      SUPABASE_URL: https://fticxzuzjgeypvqrfrwk.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_rTToWseBrrY56-SHDUjJGw_sqZi7F3J
      VITE_SUPABASE_PROJECT_ID: fticxzuzjgeypvqrfrwk
      VITE_SUPABASE_URL: https://fticxzuzjgeypvqrfrwk.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_rTToWseBrrY56-SHDUjJGw_sqZi7F3J
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Prepare static site for GitHub Pages
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
