name: Patch post service attendance details v2
on:
  push:
    paths:
      - '.github/workflows/patch-post-service-attendance-details-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/post-service.tsx src/lib/evaluation-context.ts
          git commit -m "feat: détailler retards et justifications post-service" || exit 0
          git push
