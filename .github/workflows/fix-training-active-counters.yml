name: Fix training active counters
on:
  push:
    paths:
      - '.github/workflows/fix-training-active-counters.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Formation counters and validations
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/_authenticated/formations.tsx')
          s=p.read_text()
          old=''' const[tab,setTab]=useState("mine");\n const mine=(memberPaths.data??[]).filter(x=>x.member_id===member?.id),active=(memberPaths.data??[]).filter(x=>x.status!=="completed"),integrationCount=active.filter(x=>pathById.get(x.path_id)?.path_kind==="integration").length,internalCount=active.filter(x=>pathById.get(x.path_id)?.path_kind==="internal").length,pending=(memberSteps.data??[]).filter(x=>x.status!=="done"&&!x.excluded&&x.required_snapshot).length;\n'''
          new=''' const[tab,setTab]=useState("mine");\n const activePathIds=new Set((memberPaths.data??[]).map(x=>x.id));\n const visibleMemberSteps=(memberSteps.data??[]).filter(x=>activePathIds.has(x.member_training_path_id));\n const mine=(memberPaths.data??[]).filter(x=>x.member_id===member?.id),active=(memberPaths.data??[]).filter(x=>x.status!=="completed"),integrationCount=active.filter(x=>pathById.get(x.path_id)?.path_kind==="integration").length,internalCount=active.filter(x=>pathById.get(x.path_id)?.path_kind==="internal").length,pending=visibleMemberSteps.filter(x=>x.status!=="done"&&x.status!=="na"&&!x.excluded&&x.required_snapshot).length;\n'''
          if old not in s:
            raise SystemExit('counter block not found')
          s=s.replace(old,new,1)
          old2='''<TabsContent value="validate" className="space-y-3">{(memberSteps.data??[]).filter(x=>x.status==="in_progress"||x.status==="reinforce").length===0?<EmptyState title="Aucune validation en attente"/>:(memberSteps.data??[]).filter(x=>x.status==="in_progress"||x.status==="reinforce").map(ms=>{'''
          new2='''<TabsContent value="validate" className="space-y-3">{visibleMemberSteps.filter(x=>x.status==="in_progress"||x.status==="reinforce").length===0?<EmptyState title="Aucune validation en attente"/>:visibleMemberSteps.filter(x=>x.status==="in_progress"||x.status==="reinforce").map(ms=>{'''
          if old2 not in s:
            raise SystemExit('validation block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/formations.tsx
          git commit -m "fix: exclure formations retirées des compteurs" || exit 0
          git push
