name: Fix leadership evaluation candidates
on:
  push:
    paths:
      - '.github/workflows/fix-leadership-evaluation-candidates.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch leadership candidates
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/_authenticated/evaluations.tsx')
          s=p.read_text()
          s=s.replace('evaluationsQuery, formatDateTime, logAction, membersQuery, polesQuery','evaluationsQuery, formatDateTime, logAction, membersQuery, polesQuery, settingsQuery',1)
          old=''' const evaluations=useQuery(evaluationsQuery),members=useQuery(membersQuery),poles=useQuery(polesQuery),queryClient=useQueryClient();'''
          new=''' const evaluations=useQuery(evaluationsQuery),members=useQuery(membersQuery),poles=useQuery(polesQuery),settings=useQuery(settingsQuery),queryClient=useQueryClient();'''
          if old not in s: raise SystemExit('query block not found')
          s=s.replace(old,new,1)
          old2=''' const leadershipUserIds=new Set((roleRows.data??[]).filter((r:any)=>["responsable","adjoint"].includes(r.role)).map((r:any)=>r.user_id));\n const leadershipSubjectMembers=allMembers.filter((m:any)=>m.status==="active"&&m.id!==member?.id&&m.auth_user_id&&leadershipUserIds.has(m.auth_user_id));'''
          new2=''' const leadershipUserIds=new Set((roleRows.data??[]).filter((r:any)=>["responsable","adjoint"].includes(r.role)).map((r:any)=>r.user_id));\n const configuredLeadershipMemberIds=new Set<string>();\n const appSettings:any=settings.data??{};\n if(appSettings.supervisor_member_id)configuredLeadershipMemberIds.add(appSettings.supervisor_member_id);\n if(appSettings.adjoint_member_id)configuredLeadershipMemberIds.add(appSettings.adjoint_member_id);\n if(appSettings.direction_structure==="responsable_general_grands_groupes"){\n   if(appSettings.group_leads?.communication)configuredLeadershipMemberIds.add(appSettings.group_leads.communication);\n   if(appSettings.group_leads?.audiovisuel)configuredLeadershipMemberIds.add(appSettings.group_leads.audiovisuel);\n }\n const leadershipSubjectMembers=allMembers.filter((m:any)=>m.status==="active"&&m.id!==member?.id&&((m.auth_user_id&&leadershipUserIds.has(m.auth_user_id))||configuredLeadershipMemberIds.has(m.id)));'''
          if old2 not in s: raise SystemExit('leadership block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/evaluations.tsx
          git commit -m "fix: afficher les responsables configurés dans les évaluations" || exit 0
          git push
