name: Fix technical status refresh
on:
  push:
    paths:
      - '.github/workflows/fix-technical-status-refresh.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch TechnicalAdminPanel
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/settings/TechnicalAdminPanel.tsx')
          s=p.read_text()
          old=''' const runDiagnostics=useMutation({mutationFn:async()=>{const{data,error}=await (supabase as any).rpc("technical_diagnostics");if(error)throw error;return data},onSuccess:(data:any)=>{setDiagnostics(data?.checks??[]);toast.success("Diagnostic terminé")},onError:(e:any)=>toast.error("Diagnostic impossible",{description:e.message})});\n const doExport=async(kind:"configuration"|"data")=>{'''
          new=''' const runDiagnostics=useMutation({mutationFn:async()=>{const{data,error}=await (supabase as any).rpc("technical_diagnostics");if(error)throw error;return data},onSuccess:(data:any)=>{setDiagnostics(data?.checks??[]);toast.success("Diagnostic terminé")},onError:(e:any)=>toast.error("Diagnostic impossible",{description:e.message})});\n const refreshStatus=async()=>{const result=await status.refetch();if(result.error){toast.error("Actualisation impossible",{description:(result.error as any)?.message});return}toast.success("État du système actualisé")};\n const doExport=async(kind:"configuration"|"data")=>{'''
          if old not in s: raise SystemExit('mutation block not found')
          s=s.replace(old,new,1)
          old2='''<div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><Metric label="Membres" value={s?.member_count}/><Metric label="Programmes" value={s?.program_count}/><Metric label="Sollicitations" value={s?.solicitation_count}/><Metric label="Fichiers" value={s?.file_count}/></div><Button variant="outline" onClick={()=>status.refetch()}><RefreshCw className="size-4"/>Actualiser</Button>'''
          new2='''<div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4"><Metric label="Membres actifs" value={s?.member_count}/><Metric label="Programmes actifs" value={s?.program_count}/><Metric label="Sollicitations actives" value={s?.solicitation_count}/><Metric label="Fichiers stockés" value={s?.file_count}/></div><Button variant="outline" onClick={refreshStatus} disabled={status.isFetching}><RefreshCw className={`size-4 ${status.isFetching?"animate-spin":""}`}/>{status.isFetching?"Actualisation…":"Actualiser"}</Button>'''
          if old2 not in s: raise SystemExit('status UI block not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/settings/TechnicalAdminPanel.tsx
          git commit -m "fix: actualiser les vrais volumes techniques" || exit 0
          git push
