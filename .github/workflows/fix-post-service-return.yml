name: Fix post-service return
on:
  push:
    paths:
      - '.github/workflows/fix-post-service-return.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix syntax typo
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/routes/_authenticated/post-service.tsx')
          s=p.read_text()
          old=';retur <div key={p.member_id}'
          new=';return <div key={p.member_id}'
          if old not in s:
              raise SystemExit('typo not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/_authenticated/post-service.tsx
          git commit -m "fix: corriger syntaxe présence post-service"
          git push
